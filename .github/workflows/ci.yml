name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FIRMWARE_REPO: CANShift/canshift-firmware

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  firmware-parity:
    name: firmware-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canshift-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: canshift-core
          persist-credentials: false

      - name: Checkout canshift-firmware (default branch, as sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          token: ${{ secrets.FIRMWARE_PARITY_TOKEN || github.token }}
          path: canshift-firmware
          persist-credentials: false

      - name: Verify firmware parity sources are present
        run: |
          missing=0
          for f in \
            canshift-firmware/data/config/dashboard.json \
            canshift-firmware/data/config/signals.json \
            canshift-firmware/core-schema-version.txt \
            canshift-firmware/include/app_config.h \
            canshift-firmware/src/config/config_types.h \
            canshift-firmware/src/config/config_signals_loader.inc \
            canshift-firmware/src/can/signal_map.h \
            canshift-firmware/src/hal/ble/ble_telemetry.cpp \
            canshift-firmware/src/hal/ble/telemetry_frame.h \
            canshift-firmware/src/runtime/device_commands.cpp \
            canshift-firmware/src/ui/alert_sources.h \
            canshift-firmware/.github/boards.json \
            canshift-firmware/src/ui/control_vocabulary.cpp \
            canshift-firmware/src/ui/signal_presentation.cpp \
            canshift-firmware/src/ui/widgets/gauge_widget.cpp \
            canshift-firmware/src/ui/widgets/gauge_arcs.cpp \
            canshift-firmware/src/ui/widgets/gauge_arcs.h \
            canshift-firmware/src/hal/ble/alert_frame.h \
            canshift-firmware/test/test_alert_frame/test_main.cpp \
            canshift-firmware/rust/layout-grid/src/lib.rs \
            canshift-firmware/rust/signal-map/src/lib.rs \
            canshift-firmware/rust/format-float/src/lib.rs \
            canshift-firmware/src/ui/font_manager.cpp \
            canshift-firmware/src/ui/widgets/widget_helpers.h \
            canshift-firmware/src/ui/fonts/lv_font_jbmono_medium_10_nk.c \
            canshift-firmware/data/fonts/jbmono_extrabold_22.bin; do
            if [ ! -f "$f" ]; then
              echo "::error::firmware parity source missing: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "canshift-firmware was checked out but expected parity sources are missing."
            echo "The parity suites would silently skip, hiding schema drift — failing instead."
            echo "If a file was intentionally moved or renamed in ${FIRMWARE_REPO}, update this workflow and the parity tests together."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: canshift-core/.nvmrc
          cache: npm
          cache-dependency-path: canshift-core/package-lock.json

      - name: Install core dependencies
        working-directory: canshift-core
        run: npm ci

      - name: Run full suite against the firmware sibling
        working-directory: canshift-core
        run: npm test

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: every dependency satisfies its peer and version ranges
        run: .github/scripts/check-dependency-tree.sh

  ci-success:
    name: ci-success
    needs: [lint, test, build, firmware-parity, dependencies]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::one or more required CI jobs did not succeed — see the job list above"
            exit 1
          fi
